<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Security Checker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="background-glow"></div>
    <div class="container glass-effect">
        <header>
            <div class="icon-container">
                <!-- Icono SVG o imagen podría ir aquí -->
            </div>
            <h1>Link Security Checker</h1>
            <p class="subtitle">Analiza URLs en tiempo real para detectar amenazas</p>
        </header>

        <div class="input-container">
            <input type="url" id="url-input" placeholder="Pega el enlace aquí (ej: https://sitio.com)..." autocomplete="off">
            <button id="scan-button">
                <span>Escanear</span>
            </button>
        </div>

        <div id="results-container" class="hidden">
            <div id="result-card" class="card">
                <div class="card-icon" id="card-icon"></div>
                <div class="card-content">
                    <h3>Resultado del Análisis</h3>
                    <p id="result-message"></p>
                </div>
            </div>
        </div>

        <div id="loading" class="hidden"></div>

        <footer>
            <p>Link Security Checker © 2025 | Powered by Python & Flask</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
